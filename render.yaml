# Render Blueprint — native Python web service + Postgres (no Docker)
# Docs: https://render.com/docs/blueprint-spec
#
# After first deploy: log in with DJANGO_SUPERUSER_* credentials, then create tenants
# (see docs/RENDER_DEPLOY.md). Free tier has no Shell — superuser is bootstrapped in start.sh.

databases:
  - name: office-saas-db
    plan: free
    databaseName: office_saas
    user: office_saas

services:
  - type: web
    name: office-saas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /api/docs/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: office-saas-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # Optional override; if unset, production settings allow *.onrender.com when RENDER=true
      - key: ALLOWED_HOSTS
        sync: false
      # For Swagger-only demos on free tier; tighten later
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Platform SUPER_ADMIN bootstrap (no Shell on free tier). Demo defaults — change after first login.
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin
      - key: DJANGO_SUPERUSER_FIRST_NAME
        value: Admin
      - key: DJANGO_SUPERUSER_LAST_NAME
        value: Admin
